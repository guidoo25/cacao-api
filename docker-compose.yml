version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: cacao_iot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto:latest
    restart: always
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf

  backend:
    build: 
      context: ./backend
    restart: always
    ports:
      - "3001:3001"
    environment:
      - DB_HOST=db
      - DB_USER=postgres
      - DB_PASSWORD=password
      - DB_NAME=cacao_iot
      - DB_PORT=5432
      - PORT=3001
      - JWT_SECRET=tesiscacaosecret2026
    depends_on:
      - db
    # Run migrations before starting the server
    command: sh -c "npx sequelize-cli db:migrate && npm start"

  frontend:
    build: 
      context: ./frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      # Change localhost to your server IP if deploying to the cloud
      - NEXT_PUBLIC_API_URL=http://localhost:3001/api
    depends_on:
      - backend

volumes:
  pgdata:
